<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competición | IFLXI</title>
<meta name="description" content="Ficha de competición IFLXI: equipos inscritos y temporada.">
<meta name="theme-color" content="#f3f5f9">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="brand/site.webmanifest">
<meta property="og:image" content="brand/og-image.png">
<script>
(() => { try { if (localStorage.getItem("iflxi-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (_) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="competition">

<div class="aurora"></div>
<div class="grid-bg"></div>

<header class="header header--lab">
  <div class="header__top">
    <div class="container header__top-inner">
      <div class="header__brand">
        <a class="logo" href="index.html" aria-label="IFLXI inicio">
          <img class="logo__img logo__img--for-light" src="brand/logo-dark-320.png" alt="IFLXI" width="120" height="48">
          <img class="logo__img logo__img--for-dark" src="brand/logo-white-320.png" alt="IFLXI" width="120" height="48">
        </a>
        <a class="live-pill" href="partidos.html" title="Ver partidos en directo"><span class="dot"></span> <span data-i18n="header.live">EN VIVO</span></a>
      </div>

      <div class="header-search searchbox">
        <svg class="header-search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="global-search" autocomplete="off" spellcheck="false"
               placeholder="Buscar jugador, club o liga…" data-i18n-placeholder="header.search" aria-label="Buscar jugadores, equipos o ligas">
        <kbd class="header-search__kbd">/</kbd>
        <div class="results" role="listbox"></div>
      </div>

      <div class="header__actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar tema claro/oscuro" title="Tema">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn btn--sm btn--ghost header__login" href="cuenta.html" data-i18n="header.login">Entrar</a>
        <a class="btn btn--primary btn--sm header__cta" href="cuenta.html" data-i18n="header.signup">Iniciar sesión</a>
        <button class="burger" aria-label="Abrir menú" aria-expanded="false"><span></span></button>
      </div>
    </div>
  </div>

  <div class="header__bar">
    <div class="container header__bar-inner">
      <nav class="nav" id="site-nav">
        <a href="index.html" data-nav="home" data-i18n="nav.discover">Descubre</a>
        <a href="fichajes.html" data-i18n="nav.transfers">Fichajes y rumores</a>
        <a href="mercado.html" data-i18n="nav.market">Valores de mercado</a>
        <a href="competiciones.html" data-nav="competitions" aria-current="page" data-i18n="nav.competitions">Competiciones</a>
        <a href="partidos.html" data-nav="matches" data-i18n="nav.matches">Partidos</a>
        <a href="comparador.html" data-nav="compare" data-i18n="nav.compare">Comparador</a>
        <a href="cuenta.html" data-nav="cuenta" data-i18n="nav.account">Cuenta</a>
      </nav>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <p class="match-detail__back"><a href="competiciones.html">← Competiciones</a></p>
    <div id="competition-root">
      <div class="skeleton" style="min-height:320px;margin-top:12px"></div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom">
      <span>© <span id="year">2026</span> IFLXI — Info Football Lab XI.</span>
      <a href="competiciones.html">Catálogo</a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
